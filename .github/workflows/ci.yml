name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  docker-e2e:
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for gateway to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "gateway is up"
              exit 0
            fi
            sleep 2
          done
          echo "gateway never became healthy"
          docker compose logs
          exit 1

      - name: Verify a full analysis request
        run: |
          body=$(curl -sf -X POST http://localhost:4000/analyze \
            -H "content-type: application/json" \
            -d '{"text":"The gateway relays this text to every specialist service."}')
          echo "$body"
          echo "$body" | jq -e '.status == "complete"'
          echo "$body" | jq -e '.results.stats.status == "ok"'
          echo "$body" | jq -e '.results.language.status == "ok"'
          echo "$body" | jq -e '.results.keywords.status == "ok"'

      - name: Verify graceful degradation when a specialist is down
        run: |
          docker compose stop lang-service
          sleep 1
          status=$(curl -s -o /tmp/degraded.json -w '%{http_code}' -X POST http://localhost:4000/analyze \
            -H "content-type: application/json" \
            -d '{"text":"testing graceful degradation"}')
          cat /tmp/degraded.json
          test "$status" = "207"
          jq -e '.status == "degraded"' /tmp/degraded.json
          jq -e '.results.language.status == "unavailable"' /tmp/degraded.json
          docker compose start lang-service

      - name: Verify the frontend responds
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "frontend never responded with 200"
          docker compose logs frontend
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down
